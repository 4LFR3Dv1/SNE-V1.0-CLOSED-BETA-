<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SNE Radar{% endblock %}</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
            overflow-x: hidden;
        }
        
        .terminal-header {
            background: linear-gradient(90deg, #000000 0%, #1a1a1a 50%, #000000 100%);
            border-bottom: 2px solid #00ff00;
            padding: 10px 20px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        
        .terminal-title {
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff00;
        }
        
        .terminal-subtitle {
            color: #00aa00;
            font-size: 12px;
        }
        
        .status-online {
            color: #00ff00;
            animation: blink 1s infinite;
        }
        
        .status-offline {
            color: #ff0000;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        .terminal-container {
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .terminal-card {
            background-color: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }
        
        .terminal-card:hover {
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
            transform: translateY(-2px);
            transition: all 0.3s ease;
        }
        
        .card-title {
            color: #00ff00;
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }
        
        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 10px 0;
        }
        
        .data-item {
            background-color: #111111;
            border: 1px solid #333333;
            padding: 8px;
            border-radius: 3px;
        }
        
        .data-label {
            color: #00aa00;
            font-size: 11px;
            text-transform: uppercase;
        }
        
        .data-value {
            color: #00ff00;
            font-size: 14px;
            font-weight: bold;
        }
        
        .data-value.positive {
            color: #00ff00;
        }
        
        .data-value.negative {
            color: #ff0000;
        }
        
        .data-value.warning {
            color: #ffff00;
        }
        
        .alert-rupture {
            background-color: #1a0000;
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            animation: pulse-red 2s infinite;
        }
        
        .alert-buy {
            background-color: #001a00;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            animation: pulse-green 2s infinite;
        }
        
        .alert-sell {
            background-color: #1a0000;
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            animation: pulse-red 2s infinite;
        }
        
        .alert-bullish {
            background-color: #001a00;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 8px;
            margin: 5px 0;
            border-radius: 3px;
        }
        
        .alert-bearish {
            background-color: #1a0000;
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 8px;
            margin: 5px 0;
            border-radius: 3px;
        }
        
        .alert-neutral {
            background-color: #1a1a00;
            border: 2px solid #ffff00;
            color: #ffff00;
            padding: 8px;
            margin: 5px 0;
            border-radius: 3px;
        }
        
        @keyframes pulse-red {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
            50% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.8); }
        }
        
        @keyframes pulse-green {
            0%, 100% { box-shadow: 0 0 5px rgba(0, 255, 0, 0.5); }
            50% { box-shadow: 0 0 20px rgba(0, 255, 0, 0.8); }
        }
        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle, #000000 0%, #0a0a0a 100%);
        }
        
        .login-form {
            background-color: #0a0a0a;
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 30px;
            width: 400px;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }
        
        .login-title {
            text-align: center;
            color: #00ff00;
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            color: #00aa00;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }
        
        .form-input {
            width: 100%;
            background-color: #000000;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            border-radius: 3px;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }
        
        .btn-primary {
            width: 100%;
            background-color: #000000;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 12px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: #00ff00;
            color: #000000;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.8);
        }
        
        .btn-danger {
            background-color: #000000;
            border: 2px solid #ff0000;
            color: #ff0000;
            padding: 8px 16px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            cursor: pointer;
            border-radius: 3px;
            transition: all 0.3s ease;
        }
        
        .btn-danger:hover {
            background-color: #ff0000;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        
        .grid-4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 15px;
        }
        
        .status-bar {
            background-color: #0a0a0a;
            border: 1px solid #00ff00;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .status-item {
            display: inline-block;
            margin-right: 20px;
            color: #00aa00;
        }
        
        .status-value {
            color: #00ff00;
            font-weight: bold;
        }
        
        .scroll-container {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #333333;
            padding: 10px;
            background-color: #0a0a0a;
        }
        
        .scroll-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .scroll-container::-webkit-scrollbar-track {
            background: #000000;
        }
        
        .scroll-container::-webkit-scrollbar-thumb {
            background: #00ff00;
            border-radius: 4px;
        }
        
        .scroll-container::-webkit-scrollbar-thumb:hover {
            background: #00aa00;
        }
        
        .compact-card {
            background-color: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
        }
        
        .compact-title {
            color: #00ff00;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .compact-content {
            color: #00aa00;
            font-size: 12px;
            line-height: 1.4;
        }
        
        .market-summary {
            background-color: #0a0a0a;
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .summary-symbol {
            color: #00ff00;
            font-size: 18px;
            font-weight: bold;
        }
        
        .summary-price {
            color: #00ff00;
            font-size: 20px;
            font-weight: bold;
        }
        
        .summary-change {
            font-size: 14px;
            font-weight: bold;
        }
        
        .summary-change.positive {
            color: #00ff00;
        }
        
        .summary-change.negative {
            color: #ff0000;
        }
        
        .summary-metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        
        .metric-item {
            background-color: #111111;
            border: 1px solid #333333;
            padding: 6px;
            border-radius: 3px;
            text-align: center;
        }
        
        .metric-label {
            color: #00aa00;
            font-size: 10px;
            text-transform: uppercase;
        }
        
        .metric-value {
            color: #00ff00;
            font-size: 12px;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 {
                grid-template-columns: 1fr;
            }
            
            .data-grid {
                grid-template-columns: 1fr;
            }
            
            .summary-metrics {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
