appId: com.sne.radar
productName: SNE Radar
copyright: Copyright © 2025 SNE Trading Systems

directories:
  output: dist_electron
  buildResources: build

files:
  - dist/**/*
  - electron.js
  - src/preload.js
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.finance
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Finance

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SNE Radar

dmg:
  contents:
    - x: 410
      y: 150
      type: link
      path: /Applications
    - x: 130
      y: 150
      type: file
  window:
    width: 540
    height: 380


