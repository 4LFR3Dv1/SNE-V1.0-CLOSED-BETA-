services:
  - type: web
    name: sne-radar
    env: python
    region: oregon
    plan: starter
    pythonVersion: 3.11
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TELEGRAM_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: COINGECKO_KEY
        sync: false
      - key: SCRAPERAPI_KEY
        sync: false
      - key: COINGLASS_API_KEY
        sync: false
      - key: COINMARKETCAP_API_KEY
        sync: false
      - key: ENABLE_COINGLASS
        value: "true"
      - key: ENABLE_CMC
        value: "true"
      - key: ENABLE_TA_SUMMARY
        value: "true"
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "10000"
    buildCommand: pip install -r requirements.txt
    startCommand: python sne_radar_web.py
