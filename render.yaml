services:
  - type: web
    name: sne-radar-web
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements_render.txt
      pip install psycopg2-binary
    startCommand: gunicorn --bind 0.0.0.0:$PORT sne_radar_web:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: sne-radar-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sne-radar-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sne-radar-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sne-radar-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sne-radar-db
          property: password
      - key: ENABLE_COINGLASS
        value: true
      - key: ENABLE_CMC
        value: true
      - key: ENABLE_TA_SUMMARY
        value: true
      - key: UPDATE_INTERVAL
        value: 30
      - key: REQUEST_TIMEOUT
        value: 12

databases:
  - name: sne-radar-db
    plan: free
    databaseName: sne_radar
    user: sne_radar_user